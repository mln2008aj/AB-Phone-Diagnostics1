name: Build AB's Phone Solutions

on:
  push:
  workflow_dispatch:

jobs:
  android-app:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ABPhoneSolutions.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ABPhoneSolutions-Android
      name: Build AB's Phone Solutions

on:
